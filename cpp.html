
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACSE205 - The Classroom</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        /* Top navigation */
        .top-header {
    background-color: #17365d;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.top-header nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-size: 16px;
}

.top-header nav a:hover {
    color: #ffd166;
}
        /* Main layout */
        .layout {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* Left sidebar */
        .sidebar {
            width: 280px;
            background-color: #e9edf2;
            overflow-y: auto;
            flex-shrink: 0;
            padding-bottom: 20px;
        }

        .sidebar h3 {
            padding: 15px;
            margin: 0;
            color: #17365d;
        }

        .module-button {
            width: 100%;
            padding: 14px 15px;
            border: none;
            text-align: left;
            font-size: 16px;
            background-color: #dce3eb;
            cursor: pointer;
            font-weight: bold;
        }

        .module-button:hover {
            background-color: #cbd6e2;
        }

        .lecture-list {
            display: none;
            background-color: #f5f7fa;
        }

        .lecture-list button {
            display: block;
            width: 100%;
            padding: 11px 25px;
            border: none;
            text-align: left;
            background: none;
            font-size: 14px;
            cursor: pointer;
        }

        .lecture-list button:hover {
            background-color: #dce3eb;
        }

        .lecture-list button.active {
            background-color: #cbd6e2;
            font-weight: bold;
            border-left: 4px solid #17365d;
        }

        /* Right content area */
        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .content h1 {
             margin-top: 5px;
             margin-bottom: 5px;
        }

        .welcome {
            margin-top: 40px;
            color: #555;
        }

        /* Mobile view */
        @media (max-width: 650px) {
            .top-header {
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 12px;
                padding: 16px 12px;
            }

            .logo {
                font-size: 22px;
                white-space: nowrap;
            }

            .top-header nav {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 20px;
            }

            .top-header nav a {
                margin-left: 0;
                font-size: 15px;
            }

            .layout {
                display: flex;
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 110px);
            }

            .sidebar {
                width: 100%;
                max-height: none;
                overflow: visible;
                flex-shrink: 0;
                padding-bottom: 0;
            }

            .sidebar h3 {
                display: none;
            }

            .sidebar .sidebar-toggle {
                display: block;
                width: 100%;
                padding: 15px 18px;
                border: 0;
                background: #e9edf2;
                color: #17365d;
                text-align: left;
                font-size: 18px;
                font-weight: bold;
                cursor: pointer;
            }

            .sidebar.mobile-collapsed .module-button,
            .sidebar.mobile-collapsed .lecture-list {
                display: none !important;
            }

            .sidebar:not(.mobile-collapsed) .module-button {
                display: block;
            }

            .content {
                width: 100%;
                min-width: 0;
                padding: 20px 16px;
                overflow: visible;
            }

            .content h1 {
                font-size: 25px;
                line-height: 1.25;
                overflow-wrap: anywhere;
            }

            .content p {
                line-height: 1.5;
            }

            .welcome {
                margin-top: 24px;
            }

            .video-container {
                width: 100%;
                max-width: 100%;
                margin: 12px 0 18px;
            }

            .lecture-navigation {
                width: 100%;
                gap: 10px;
                margin: 20px 0 28px;
                padding-top: 16px;
            }

            .lecture-navigation button {
                flex: 1;
                min-width: 0;
                padding: 11px 8px;
                font-size: 14px;
            }

            .material-card {
                width: 100%;
                padding: 16px;
                overflow-wrap: anywhere;
            }
        }

        /* The mobile Course Contents toggle is hidden on desktop */
        .sidebar-toggle {
            display: none;
        }

/* Lecture content styling */

.content h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

.lecture-info {
    margin: 5px 0;
    font-size: 14px;
}



.video-container {
    width: 100%;
    max-width: 750px;
    aspect-ratio: 16 / 9;
    margin: 8px auto 15px;
    border-radius: 10px;
    overflow: hidden;
    background-color: #eeeeee;
}

.video-container iframe {
    width: 100%;
    height: 100%;
    border: none;
}





.lecture-navigation {
    display: flex;
    justify-content: space-between;
    max-width: 750px;
    margin: 20px auto 35px;
}


.lecture-navigation button {
    background-color: #17365d;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
}

.lecture-navigation button:hover {
    background-color: #28558a;
}

.lecture-navigation button:disabled {
    background-color: #aaa;
    cursor: not-allowed;
}


.material-card {
    background-color: #f4f7fb;
    padding: 18px;
    margin: 12px 0;
    border-radius: 8px;
    border-left: 4px solid #17365d;
}

.material-card h3 {
    margin-top: 0;
    color: #17365d;
}

.lecture-navigation {
    display: flex;
    justify-content: space-between;
    margin-top: 35px;
    padding-top: 20px;
    border-top: 1px solid #ddd;
}

.lecture-navigation button {
    background-color: #17365d;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
}

.lecture-navigation button:hover {
    background-color: #28558a;
}

.lecture-navigation button:disabled {
    background-color: #aaa;
    cursor: not-allowed;
}
.progress-container {
    width: 100%;
    max-width: 750px;
    height: 6px;
    background-color: #e5e5e5;
    border-radius: 10px;
    overflow: hidden;
    margin: 5px 0 8px;
}

.progress-bar {
    height: 100%;
    background-color: #2878c8;
    border-radius: 10px;
    transition: width 0.3s ease;
}
.lecture-duration {
    color: #777;
    font-size: 14px;
    margin: 5px 0 12px;
}
    </style>
</head>

<body>

<header class="top-header">

    <div class="logo">
        The Classroom
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#courses">Courses</a>
        <a href="index.html#about">About</a>
    </nav>

</header>

<div class="layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar mobile-collapsed" id="courseSidebar">

        <h3>Course Contents</h3>
        <button class="sidebar-toggle" onclick="toggleSidebar()" aria-expanded="false">
            ☰ Course Contents <span id="sidebarArrow">▼</span>
        </button>

        <button class="module-button" onclick="toggleModule(1)">
            Module 1: Introduction to C++ ▼
        </button>

        <div class="lecture-list" id="module1">
            <button onclick="openLecture(1, 1, this)">Lecture 1: Introduction to C++</button>
            <button onclick="openLecture(1, 2, this)">Lecture 2: Structure of a C++ Program</button>
            <button onclick="openLecture(1, 3, this)">Lecture 3: Data Types and Variables</button>
            <button onclick="openLecture(1, 4, this)">Lecture 4: Input and Output Streams</button>
            <button onclick="openLecture(1, 5, this)">Lecture 5: Control Statements and Loops</button>
            <button onclick="openLecture(1, 6, this)">Lecture 6: Functions in C++</button>
            <button onclick="openLecture(1, 7, this)">Lecture 7: Function Overloading</button>
            <button onclick="openLecture(1, 8, this)">Lecture 8: Default Arguments and Inline Functions</button>
            <button onclick="openLecture(1, 9, this)">Lecture 9: Classes and Objects</button>
        </div>

        <button class="module-button" onclick="toggleModule(2)">
            Module 2: Classes and Objects ▼
        </button>

        <div class="lecture-list" id="module2">
            <button onclick="openLecture(2, 1, this)">Lecture 10: Defining Classes and Objects</button>
            <button onclick="openLecture(2, 2, this)">Lecture 11: Access Specifiers</button>
            <button onclick="openLecture(2, 3, this)">Lecture 12: Member Functions</button>
            <button onclick="openLecture(2, 4, this)">Lecture 13: Static Members</button>
            <button onclick="openLecture(2, 5, this)">Lecture 14: Constructors</button>
            <button onclick="openLecture(2, 6, this)">Lecture 15: Types of Constructors</button>
            <button onclick="openLecture(2, 7, this)">Lecture 16: Copy Constructors</button>
            <button onclick="openLecture(2, 8, this)">Lecture 17: Destructors</button>
            <button onclick="openLecture(2, 9, this)">Lecture 18: Friend Functions and Classes</button>
        </div>

        <button class="module-button" onclick="toggleModule(3)">
            Module 3: Operator Overloading and Inheritance ▼
        </button>

        <div class="lecture-list" id="module3">
            <button onclick="openLecture(3, 1, this)">Lecture 19: Operator Overloading</button>
            <button onclick="openLecture(3, 2, this)">Lecture 20: Unary Operator Overloading</button>
            <button onclick="openLecture(3, 3, this)">Lecture 21: Binary Operator Overloading</button>
            <button onclick="openLecture(3, 4, this)">Lecture 22: Friend Function Overloading</button>
            <button onclick="openLecture(3, 5, this)">Lecture 23: Introduction to Inheritance</button>
            <button onclick="openLecture(3, 6, this)">Lecture 24: Types of Inheritance</button>
            <button onclick="openLecture(3, 7, this)">Lecture 25: Multilevel and Multiple Inheritance</button>
            <button onclick="openLecture(3, 8, this)">Lecture 26: Hierarchical and Hybrid Inheritance</button>
            <button onclick="openLecture(3, 9, this)">Lecture 27: Constructors in Inheritance</button>
        </div>

        <button class="module-button" onclick="toggleModule(4)">
            Module 4: Polymorphism ▼
        </button>

        <div class="lecture-list" id="module4">
            <button onclick="openLecture(4, 1, this)">Lecture 28: Introduction to Polymorphism</button>
            <button onclick="openLecture(4, 2, this)">Lecture 29: Function Overriding</button>
            <button onclick="openLecture(4, 3, this)">Lecture 30: Virtual Functions</button>
            <button onclick="openLecture(4, 4, this)">Lecture 31: Pure Virtual Functions</button>
            <button onclick="openLecture(4, 5, this)">Lecture 32: Abstract Classes</button>
            <button onclick="openLecture(4, 6, this)">Lecture 33: Compile-time and Runtime Polymorphism</button>
            <button onclick="openLecture(4, 7, this)">Lecture 34: Pointers to Objects</button>
            <button onclick="openLecture(4, 8, this)">Lecture 35: Dynamic Memory Allocation</button>
            <button onclick="openLecture(4, 9, this)">Lecture 36: Virtual Destructors</button>
        </div>

        <button class="module-button" onclick="toggleModule(5)">
            Module 5: Templates and File Handling ▼
        </button>

        <div class="lecture-list" id="module5">
            <button onclick="openLecture(5, 1, this)">Lecture 37: Function Templates</button>
            <button onclick="openLecture(5, 2, this)">Lecture 38: Class Templates</button>
            <button onclick="openLecture(5, 3, this)">Lecture 39: Exception Handling</button>
            <button onclick="openLecture(5, 4, this)">Lecture 40: Try, Catch and Throw</button>
            <button onclick="openLecture(5, 5, this)">Lecture 41: Multiple Catch Blocks</button>
            <button onclick="openLecture(5, 6, this)">Lecture 42: Introduction to File Handling</button>
            <button onclick="openLecture(5, 7, this)">Lecture 43: Reading and Writing Files</button>
            <button onclick="openLecture(5, 8, this)">Lecture 44: Random Access in Files</button>
            <button onclick="openLecture(5, 9, this)">Lecture 45: Introduction to STL</button>
        </div>

    </aside>

    <!-- RIGHT CONTENT AREA -->
    <main class="content" id="mainContent">

        <h1>Welcome to TACSE205</h1>

        <p>Object Oriented Programming with C++</p>

        <div class="welcome">
            <h2>Course Overview</h2>
            <p>This course contains five modules and 45 lectures.</p>
            <p>Select a module from the left panel to explore its lectures.</p>
            <p>Select any lecture to view its learning materials here.</p>
        </div>

    </main>

</div>

<script>

    
let currentLectureIndex = -1;

function toggleSidebar() {
    const sidebar = document.getElementById("courseSidebar");
    const toggleButton = document.querySelector(".sidebar-toggle");
    const arrow = document.getElementById("sidebarArrow");

    sidebar.classList.toggle("mobile-collapsed");

    const isOpen = !sidebar.classList.contains("mobile-collapsed");
    toggleButton.setAttribute("aria-expanded", isOpen);
    arrow.textContent = isOpen ? "▲" : "▼";
}

function closeSidebarOnMobile() {
    if (window.matchMedia("(max-width: 650px)").matches) {
        const sidebar = document.getElementById("courseSidebar");
        const toggleButton = document.querySelector(".sidebar-toggle");
        const arrow = document.getElementById("sidebarArrow");

        sidebar.classList.add("mobile-collapsed");
        toggleButton.setAttribute("aria-expanded", "false");
        arrow.textContent = "▼";
    }
}

function toggleModule(number) {

    const module = document.getElementById("module" + number);

    if (module.style.display === "block") {
        module.style.display = "none";
    } else {
        module.style.display = "block";
    }
}

function openLecture(moduleNumber, lectureNumber, button) {

    const allLectures = document.querySelectorAll(".lecture-list button");

    currentLectureIndex = Array.from(allLectures).indexOf(button);

    // Remove previous selection
    allLectures.forEach(btn => {
        btn.classList.remove("active");
    });

    // Highlight selected lecture
    button.classList.add("active");

    showLectureContent(button.textContent);
    closeSidebarOnMobile();
}





function showLectureContent(title) {

    document.getElementById("mainContent").innerHTML = `

        <h1>${title}</h1>

        <p class="lecture-duration">
            Duration: To be updated
        </p>

        <div class="video-container">
            <iframe
                src="https://www.youtube.com/embed/jNQXAC9IVRw"
                title="Sample C++ Lecture Video"
                allowfullscreen>
            </iframe>
        </div>

        <div class="lecture-navigation">

            <button onclick="moveLecture(-1)"
                ${currentLectureIndex === 0 ? "disabled" : ""}>
                ← Previous Lecture
            </button>

            <button onclick="moveLecture(1)"
                ${currentLectureIndex === 44 ? "disabled" : ""}>
                Next Lecture →
            </button>

        </div>

        <h2>Lecture Materials</h2>

        <div class="material-card">
            <h3>Lecture Notes</h3>
            <a href="materials/cpp-lecture1-notes.pdf" target="_blank">
                View Lecture Notes (PDF)
            </a>
        </div>

        <div class="material-card">
            <h3>Solved Examples</h3>
            <a href="materials/cpp-lecture1-examples.pdf" target="_blank">
                View Solved Examples (PDF)
            </a>
        </div>

        <div class="material-card">
            <h3>Practice Questions</h3>
            <a href="materials/cpp-lecture1-questions.pdf" target="_blank">
                View Practice Questions (PDF)
            </a>
        </div>
    `;
}





function moveLecture(direction) {

    const allLectures = document.querySelectorAll(".lecture-list button");

    const newIndex = currentLectureIndex + direction;

    if (newIndex < 0 || newIndex >= allLectures.length) {
        return;
    }

    const button = allLectures[newIndex];

    const moduleList = button.closest(".lecture-list");
    moduleList.style.display = "block";

    const moduleNumber = moduleList.id.replace("module", "");
    const lectureNumber = Array.from(moduleList.children).indexOf(button) + 1;

    openLecture(moduleNumber, lectureNumber, button);
}

</script>

</body>
</html>
